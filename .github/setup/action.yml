name: Setup Tools
description: Action that sets up Node, pnpm, and caching
runs:
  steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
 
    - uses: pnpm/action-setup@v3
      with:
        version: 8
 
    - name: Setup Node.js environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'
 
    - name: Install dependencies
      run: pnpm install
